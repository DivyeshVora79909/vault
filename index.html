<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="Vault — offline, zero-knowledge file encryption that runs entirely in your browser."
    />
    <title>Vault — offline file encryption</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="modulepreload" href="./src/app.js" />

    <script type="module">
      import { start } from './src/app.js';
      start();
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', () =>
          navigator.serviceWorker.register('./sw.js').catch(() => {}),
        );
      }
    </script>
  </head>

  <body
    x-data="vault"
    x-cloak
    :data-bulk="selected.length ? 1 : 0"
    @keydown.window="onKey($event)"
    @dragover.prevent="dragging = true"
    @dragleave.self="dragging = false"
    @drop.prevent="onDrop($event)"
  >
    <!-- Icon sprite. Every `<use href="#i-…">` in the app resolves here. -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 6.5-7 9-4-2.5-7-5-7-9V6z"/><path d="M9.5 12.5l1.8 1.8 3.4-3.4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V6l12-2v10"/></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M8.5 17.5c2-1 3-4 2.5-5s-1.5.5-1 3 2.5 3.5 4 3.5"/></symbol>
      <symbol id="i-markdown" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 15V9l3 3 3-3v6"/><path d="M16 9v6l2-2"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M8 12h8M8 15h8M8 18h5"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9.5 12.5L8 14l1.5 1.5M14.5 12.5L16 14l-1.5 1.5"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3 6h18v4H3z"/><path d="M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9"/><path d="M10 14h4"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M8 13h8M8 17h4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 15h8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 12l7-7 7 7M12 5v14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M8 13l4-4 4 4M4 3h16"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.5"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A10 10 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3.2 3.6"/><path d="M6.6 7.7A15 15 0 0 0 2 12s3.5 6 10 6c1 0 1.9-.1 2.7-.4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16.5 2.5l4 4-2 2-4-4"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M14 7h7M14 12h5M14 17h3"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M4 6h16M4 12h11a3 3 0 1 1 0 6h-3"/><path d="M14 15l-2 3 2 3"/><path d="M4 18h4"/></symbol>
    </svg>

    <!-- Progress + notifications -->
    <div class="progress" x-show="busy.on" x-cloak>
      <i :style="`width: ${busy.pct}%`"></i>
      <span x-text="busy.label"></span>
    </div>

    <div class="toasts" aria-live="polite">
      <template x-for="t in toasts" :key="t.id">
        <div class="toast" :data-tone="t.tone">
          <svg class="icon"><use :href="t.tone === 'ok' ? '#i-check' : '#i-help'"/></svg>
          <span x-text="t.message"></span>
        </div>
      </template>
    </div>

    <div class="dragveil" x-show="dragging" x-cloak x-transition.opacity>
      <span x-text="view === 'vault' ? 'Drop to add to this folder' : 'Drop a .svault file'"></span>
    </div>

    <!-- ==================== Lock screen ==================== -->
    <main class="lock" x-show="view === 'lock'">
      <div class="lock-card">
        <div class="brand">
          <span class="brand-mark"><svg class="icon icon-lg"><use href="#i-shield"/></svg></span>
          <div>
            <h1>Vault</h1>
            <p>Offline encryption. Nothing leaves this device.</p>
          </div>
        </div>

        <p class="note" x-show="insecure" x-cloak
           style="color: var(--crit); border: 1px solid var(--crit); border-radius: 9px; padding: 10px">
          This page is not in a secure context, so the browser withholds the
          Web Crypto API. Serve it over HTTPS or from localhost.
        </p>

        <div class="tabs" role="tablist">
          <button role="tab" :aria-selected="mode === 'open'" @click="mode = 'open'">Open vault</button>
          <button role="tab" :aria-selected="mode === 'create'" @click="mode = 'create'">Create new</button>
        </div>

        <!-- Open -->
        <template x-if="mode === 'open'">
          <div style="display: grid; gap: 14px">
            <button class="dropzone" :class="dragging && 'is-over'" @click="pickVault()">
              <svg class="icon icon-lg"><use href="#i-folder"/></svg>
              <span x-show="!pickedName">Choose or drop a <strong>.svault</strong> file</span>
              <strong x-show="pickedName" x-text="pickedName"></strong>
            </button>
            <input type="file" accept=".svault,application/octet-stream" class="sr"
                   x-ref="vaultInput" @change="onVaultInput($event)" />

            <template x-if="recent.length">
              <section style="display: grid; gap: 6px">
                <h4 style="margin: 0; font-size: .74rem; color: var(--faint); text-transform: uppercase; letter-spacing: .07em">Recent</h4>
                <div class="recent">
                  <template x-for="item in recent" :key="item.id">
                    <div class="recent-item">
                      <button @click="useRecent(item)">
                        <svg class="icon"><use href="#i-box"/></svg>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">
                          <span x-text="item.name"></span>
                          <small x-text="relTime(item.openedAt)"></small>
                        </span>
                      </button>
                      <button class="btn btn-ghost btn-icon" title="Forget" @click="dropRecent(item)">
                        <svg class="icon"><use href="#i-x"/></svg>
                      </button>
                    </div>
                  </template>
                </div>
              </section>
            </template>

            <div class="input-wrap">
              <input class="field" x-ref="pwInput" :type="reveal ? 'text' : 'password'"
                     x-model="pw" placeholder="Master password" autocomplete="current-password"
                     @keydown.enter="unlock()" />
              <button class="btn btn-ghost" @click="reveal = !reveal"
                      :aria-label="reveal ? 'Hide password' : 'Show password'">
                <svg class="icon"><use :href="reveal ? '#i-eye-off' : '#i-eye'"/></svg>
              </button>
            </div>

            <button class="btn btn-primary btn-block btn-lg" @click="unlock()" :disabled="busy.on">
              <svg class="icon"><use href="#i-key"/></svg> Unlock
            </button>
          </div>
        </template>
        <!-- Create -->
        <template x-if="mode === 'create'">
          <div style="display: grid; gap: 14px">
            <div class="input-wrap">
              <input class="field" :type="reveal ? 'text' : 'password'" x-model="pw"
                     placeholder="New master password" autocomplete="new-password" />
              <button class="btn btn-ghost" @click="reveal = !reveal"
                      :aria-label="reveal ? 'Hide password' : 'Show password'">
                <svg class="icon"><use :href="reveal ? '#i-eye-off' : '#i-eye'"/></svg>
              </button>
            </div>
            <input class="field" :type="reveal ? 'text' : 'password'" x-model="pw2"
                   placeholder="Repeat password" autocomplete="new-password" />

            <div style="display: grid; gap: 6px">
              <div class="meter"><i :style="`width: ${strength.score}%`" :data-tone="strength.tone"></i></div>
              <div class="meter-row">
                <span x-text="strength.label"></span>
                <span x-text="`${strength.bits} bits`"></span>
              </div>
              <template x-for="hint in strength.hints" :key="hint">
                <p class="note" style="margin: 0" x-text="hint"></p>
              </template>
            </div>

            <div style="display: flex; gap: 8px">
              <button class="btn" style="flex: 1" @click="generate()">
                <svg class="icon"><use href="#i-dice"/></svg> Generate
              </button>
              <button class="btn" style="flex: 1" @click="copyPassword()" :disabled="!pw">
                <svg class="icon"><use href="#i-copy"/></svg> Copy
              </button>
            </div>

            <label style="display: grid; gap: 6px; font-size: .8rem; color: var(--muted)">
              Key-stretching strength
              <select class="field" x-model.number="settings.iterations">
                <option value="200000">Fast — older phones</option>
                <option value="600000">Balanced — recommended</option>
                <option value="1200000">Paranoid — slow unlock</option>
              </select>
            </label>

            <button class="btn btn-primary btn-block btn-lg" @click="create()">
              <svg class="icon"><use href="#i-shield"/></svg> Create vault
            </button>
            <p class="note">
              There is no password recovery. Lose the password and the data is gone —
              that is the point.
            </p>
          </div>
        </template>
      </div>
    </main>
    <!-- ==================== Vault ==================== -->
    <section class="shell" x-show="view === 'vault'" x-cloak>
      <header class="topbar">
        <div class="topbar-id">
          <svg class="icon" style="color: var(--accent)"><use href="#i-shield"/></svg>
          <div style="min-width: 0">
            <h2 x-text="vaultName"></h2>
            <small x-text="`${stats.count} files · ${stats.size} · ${stats.format}`"></small>
          </div>
          <span class="chip chip-warn" x-show="dirty" x-cloak>Unsaved</span>
        </div>

        <div class="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input class="field" x-ref="search" x-model.debounce.200ms="query"
                 placeholder="Search all files  ( / )" />
        </div>

        <button class="btn btn-primary" @click="save()" :disabled="busy.on">
          <svg class="icon"><use href="#i-save"/></svg>
          <span x-text="dirty ? 'Save' : 'Saved'"></span>
        </button>
        <button class="btn btn-ghost btn-icon" title="Settings" @click="settingsOpen = true">
          <svg class="icon"><use href="#i-settings"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" title="Lock vault" @click="lock()">
          <svg class="icon"><use href="#i-power"/></svg>
        </button>
      </header>

      <div class="subbar">
        <button class="btn btn-ghost btn-icon" title="Up one folder" @click="up()" :disabled="!cwd">
          <svg class="icon"><use href="#i-left"/></svg>
        </button>
        <nav class="crumbs">
          <button @click="goto('')">Vault</button>
          <template x-for="crumb in crumbs" :key="crumb.path">
            <span style="display: contents">
              <span>/</span><button @click="goto(crumb.path)" x-text="crumb.name"></button>
            </span>
          </template>
          <span x-show="searching" x-cloak style="color: var(--muted)">
            — results for “<span x-text="query"></span>”
          </span>
        </nav>

        <span class="spacer"></span>

        <button class="btn" @click="$refs.filesInput.click()">
          <svg class="icon"><use href="#i-plus"/></svg> Files
        </button>
        <button class="btn btn-ghost btn-icon" title="Add a folder" @click="$refs.folderInput.click()">
          <svg class="icon"><use href="#i-upload"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" title="New folder" @click="newFolder()">
          <svg class="icon"><use href="#i-folder-plus"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" title="New note" @click="newNote()">
          <svg class="icon"><use href="#i-pencil"/></svg>
        </button>
        <select class="field" style="width: auto; min-height: 38px" x-model="settings.sort" @change="refresh()">
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="date">Modified</option>
          <option value="type">Type</option>
        </select>
        <button class="btn btn-ghost btn-icon" :title="`Order: ${settings.order}`"
                @click="settings.order = settings.order === 'asc' ? 'desc' : 'asc'; refresh()">
          <svg class="icon"><use href="#i-sort"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" title="Grid or list"
                @click="settings.layout = settings.layout === 'grid' ? 'list' : 'grid'">
          <svg class="icon"><use :href="settings.layout === 'grid' ? '#i-list' : '#i-grid'"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" title="Keyboard shortcuts" @click="helpOpen = true">
          <svg class="icon"><use href="#i-help"/></svg>
        </button>
      </div>

      <input type="file" multiple class="sr" x-ref="filesInput" @change="onPick($event)" />
      <input type="file" webkitdirectory multiple class="sr" x-ref="folderInput" @change="onPick($event)" />

      <div class="content" @contextmenu.prevent>
        <div class="empty" x-show="!rows.length">
          <svg class="icon"><use href="#i-box"/></svg>
          <p x-text="searching ? 'Nothing matches that search.' : 'This folder is empty.'"></p>
          <button class="btn" @click="$refs.filesInput.click()" x-show="!searching">
            <svg class="icon"><use href="#i-plus"/></svg> Add files
          </button>
        </div>

        <!-- Grid -->
        <div class="grid" x-show="settings.layout === 'grid' && rows.length">
          <template x-for="row in rows" :key="row.path">
            <div class="tile" :aria-selected="isSelected(row.path)" tabindex="0"
                 @click="selected.length ? toggleSelect(row.path) : activate(row)"
                 @keydown.enter.prevent="activate(row)"
                 @contextmenu.prevent.stop="openMenu($event, row)"
                 @touchstart.passive="pressStart($event, row)"
                 @touchend="pressEnd()" @touchmove.passive="pressEnd()"
                 @touchcancel="pressEnd()">
              <div class="tile-art">
                <img x-show="thumbs[row.path]" :src="thumbs[row.path]" alt="" loading="lazy" />
                <svg class="icon" x-show="!thumbs[row.path]"><use :href="`#${iconOf(row)}`"/></svg>
                <span class="tile-badge" x-show="row.ext" x-text="row.ext"></span>
              </div>
              <span class="tile-name" x-text="row.name"></span>
              <span class="tile-meta">
                <span x-text="row.dir ? 'Folder' : fmtSize(row.size)"></span>
                <button class="btn btn-ghost" style="min-height: 0; padding: 0 2px"
                        @click.stop="openMenu($event, row)" aria-label="Actions">
                  <svg class="icon"><use href="#i-more"/></svg>
                </button>
              </span>
              <span class="tile-check" @click.stop="toggleSelect(row.path)">
                <svg class="icon" style="width: 14px; height: 14px"><use href="#i-check"/></svg>
              </span>
            </div>
          </template>
        </div>

        <!-- List -->
        <div class="list" x-show="settings.layout === 'list' && rows.length">
          <template x-for="row in rows" :key="row.path">
            <div class="rowitem" :aria-selected="isSelected(row.path)" tabindex="0"
                 @click="selected.length ? toggleSelect(row.path) : activate(row)"
                 @keydown.enter.prevent="activate(row)"
                 @contextmenu.prevent.stop="openMenu($event, row)"
                 @touchstart.passive="pressStart($event, row)"
                 @touchend="pressEnd()" @touchmove.passive="pressEnd()"
                 @touchcancel="pressEnd()">
              <span class="rowitem-art" @click.stop="toggleSelect(row.path)">
                <img x-show="thumbs[row.path]" :src="thumbs[row.path]" alt="" loading="lazy" />
                <svg class="icon" x-show="!thumbs[row.path]"><use :href="`#${iconOf(row)}`"/></svg>
              </span>
              <span class="rowitem-name">
                <b x-text="row.name"></b>
                <small x-text="row.dir ? 'Folder' : `${row.ext || 'file'} · ${fmtDate(row.date)}`"></small>
              </span>
              <span class="rowitem-size" x-text="row.dir ? '' : fmtSize(row.size)"></span>
              <button class="btn btn-ghost btn-icon" @click.stop="openMenu($event, row)" aria-label="Actions">
                <svg class="icon"><use href="#i-more"/></svg>
              </button>
            </div>
          </template>
        </div>
      </div>

      <div class="bulkbar" x-show="selected.length" x-cloak>
        <b x-text="`${selected.length} selected`"></b>
        <span class="spacer"></span>
        <button class="btn btn-ghost" @click="selectAll()">All</button>
        <button class="btn" @click="act('zip', selected)">
          <svg class="icon"><use href="#i-download"/></svg> Export
        </button>
        <button class="btn" @click="act('pdf', selected)">
          <svg class="icon"><use href="#i-pdf"/></svg> PDF
        </button>
        <button class="btn" @click="act('move', selected)">
          <svg class="icon"><use href="#i-move"/></svg> Move
        </button>
        <button class="btn btn-danger" @click="act('delete', selected)">
          <svg class="icon"><use href="#i-trash"/></svg> Delete
        </button>
        <button class="btn btn-ghost btn-icon" @click="selected = []" aria-label="Clear selection">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
    </section>
    <!-- ==================== Action menu ==================== -->
    <template x-if="menu.open">
      <div>
        <div class="scrim" @click="closeMenu()"></div>
        <div class="menu" :style="`--menu-x: ${menu.x}px; --menu-y: ${menu.y}px`" @click.outside="closeMenu()">
          <div class="grab"></div>
          <p class="menu-title" x-text="menu.row?.name"></p>
          <button @click="act('open')">
            <svg class="icon"><use href="#i-eye"/></svg> Open
          </button>
          <button @click="act('download')" x-show="!menu.row?.dir">
            <svg class="icon"><use href="#i-download"/></svg> Export a copy
          </button>
          <button @click="act('zip')" x-show="menu.row?.dir">
            <svg class="icon"><use href="#i-download"/></svg> Export folder as .zip
          </button>
          <button @click="act('pdf')" x-show="!menu.row?.dir && menu.row && iconOf(menu.row) === 'i-image'">
            <svg class="icon"><use href="#i-pdf"/></svg> Convert to PDF
          </button>
          <button @click="act('select')">
            <svg class="icon"><use href="#i-check"/></svg> Select
          </button>
          <hr />
          <button @click="act('rename')">
            <svg class="icon"><use href="#i-pencil"/></svg> Rename
          </button>
          <button @click="act('move')">
            <svg class="icon"><use href="#i-move"/></svg> Move to folder
          </button>
          <button class="danger" @click="act('delete')">
            <svg class="icon"><use href="#i-trash"/></svg> Delete
          </button>
        </div>
      </div>
    </template>

    <!-- ==================== Settings ==================== -->
    <template x-if="settingsOpen">
      <div>
        <div class="scrim" @click="settingsOpen = false"></div>
        <div class="sheet">
          <div class="grab"></div>
          <div class="sheet-head">
            <svg class="icon"><use href="#i-settings"/></svg>
            <h3>Settings</h3>
            <button class="btn btn-ghost btn-icon" @click="settingsOpen = false" aria-label="Close">
              <svg class="icon"><use href="#i-x"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <section>
              <h4>Appearance</h4>
              <label class="switch">Theme
                <select class="field" style="width: auto" x-model="settings.theme" @change="applyTheme()">
                  <option value="system">Match system</option>
                  <option value="dark">Dark</option>
                  <option value="light">Light</option>
                </select>
              </label>
              <label class="switch">Generate thumbnails
                <input type="checkbox" x-model="settings.thumbnails" @change="queueThumbs()" />
              </label>
            </section>

            <section>
              <h4>Security</h4>
              <label class="switch">Auto-lock after
                <select class="field" style="width: auto" x-model.number="settings.autolockMinutes">
                  <option value="0">Never</option>
                  <option value="2">2 minutes</option>
                  <option value="10">10 minutes</option>
                  <option value="30">30 minutes</option>
                </select>
              </label>
              <label class="switch">Key-stretching
                <select class="field" style="width: auto" x-model.number="settings.iterations">
                  <option value="200000">Fast — older phones</option>
                  <option value="600000">Balanced — recommended</option>
                  <option value="1200000">Paranoid — slow unlock</option>
                </select>
              </label>
              <p class="note">Applied the next time you save. Current file uses
                <span x-text="stats.iterations.toLocaleString()"></span> iterations.</p>
              <button class="btn btn-block" @click="settingsOpen = false; rekey.open = true">
                <svg class="icon"><use href="#i-key"/></svg> Change master password
              </button>
            </section>

            <section>
              <h4>Saving</h4>
              <label class="switch">Auto-save after changes
                <input type="checkbox" x-model="settings.autosave" :disabled="!handle" />
              </label>
              <p class="note" x-show="!handle">Auto-save needs a file on disk — use “Save a copy” once first.</p>
              <button class="btn btn-block" @click="settingsOpen = false; saveAs()">
                <svg class="icon"><use href="#i-save"/></svg> Save a copy / Save as…
              </button>
              <button class="btn btn-block" @click="settingsOpen = false; exportMany([])">
                <svg class="icon"><use href="#i-download"/></svg> Export everything as .zip
              </button>
            </section>
          </div>
        </div>
      </div>
    </template>
    <!-- ==================== Prompt / confirm ==================== -->
    <template x-if="dialog.open">
      <div>
        <div class="scrim" style="z-index: 55" @click="closeDialog(false)"></div>
        <div class="sheet" style="z-index: 56">
          <div class="grab"></div>
          <div class="sheet-head">
            <h3 x-text="dialog.title"></h3>
          </div>
          <div class="sheet-body">
            <p class="note" x-show="dialog.message" x-text="dialog.message"></p>
            <input class="field" x-show="dialog.input && !dialog.choices" x-model="dialog.value"
                   x-init="$nextTick(() => $el.focus())" @keydown.enter="closeDialog(true)"
                   spellcheck="false" />
            <select class="field" x-show="dialog.choices" x-model="dialog.value">
              <template x-for="choice in dialog.choices || []" :key="choice.value">
                <option :value="choice.value" x-text="choice.label"></option>
              </template>
            </select>
            <div style="display: flex; gap: 8px; justify-content: flex-end">
              <button class="btn" @click="closeDialog(false)">Cancel</button>
              <button class="btn" :class="dialog.danger ? 'btn-danger' : 'btn-primary'"
                      @click="closeDialog(true)" x-text="dialog.ok"></button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ==================== Change password ==================== -->
    <template x-if="rekey.open">
      <div>
        <div class="scrim" @click="rekey.open = false"></div>
        <div class="sheet">
          <div class="grab"></div>
          <div class="sheet-head">
            <svg class="icon"><use href="#i-key"/></svg>
            <h3>Change master password</h3>
            <button class="btn btn-ghost btn-icon" @click="rekey.open = false" aria-label="Close">
              <svg class="icon"><use href="#i-x"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <input class="field" type="password" x-model="rekey.pw" placeholder="New password"
                   autocomplete="new-password" />
            <input class="field" type="password" x-model="rekey.pw2" placeholder="Repeat new password"
                   autocomplete="new-password" />
            <div style="display: grid; gap: 6px">
              <div class="meter"><i :style="`width: ${rekeyStrength.score}%`" :data-tone="rekeyStrength.tone"></i></div>
              <div class="meter-row">
                <span x-text="rekeyStrength.label"></span>
                <span x-text="`${rekeyStrength.bits} bits`"></span>
              </div>
            </div>
            <div style="display: flex; gap: 8px">
              <button class="btn" style="flex: 1" @click="suggestRekey()">
                <svg class="icon"><use href="#i-dice"/></svg> Generate
              </button>
              <button class="btn btn-primary" style="flex: 1" @click="applyRekey()">Change</button>
            </div>
            <p class="note">The new password takes effect when you save the vault.</p>
          </div>
        </div>
      </div>
    </template>

    <!-- ==================== Shortcuts ==================== -->
    <template x-if="helpOpen">
      <div>
        <div class="scrim" @click="helpOpen = false"></div>
        <div class="sheet">
          <div class="grab"></div>
          <div class="sheet-head">
            <svg class="icon"><use href="#i-help"/></svg>
            <h3>Shortcuts &amp; behaviour</h3>
            <button class="btn btn-ghost btn-icon" @click="helpOpen = false" aria-label="Close">
              <svg class="icon"><use href="#i-x"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <section class="rows">
              <div class="rows-kv"><span><kbd>Ctrl/⌘</kbd> + <kbd>S</kbd></span><span>Save vault (or the open file)</span></div>
              <div class="rows-kv"><span><kbd>/</kbd></span><span>Search</span></div>
              <div class="rows-kv"><span><kbd>Ctrl/⌘</kbd> + <kbd>A</kbd></span><span>Select everything here</span></div>
              <div class="rows-kv"><span><kbd>Del</kbd></span><span>Delete selection</span></div>
              <div class="rows-kv"><span><kbd>Backspace</kbd></span><span>Up one folder</span></div>
              <div class="rows-kv"><span><kbd>←</kbd> <kbd>→</kbd></span><span>Previous / next file in the viewer</span></div>
              <div class="rows-kv"><span><kbd>+</kbd> <kbd>-</kbd> <kbd>0</kbd></span><span>Zoom in, out, reset</span></div>
              <div class="rows-kv"><span><kbd>Esc</kbd></span><span>Close whatever is open</span></div>
              <div class="rows-kv"><span><kbd>?</kbd></span><span>This panel</span></div>
            </section>
            <section>
              <h4>Good to know</h4>
              <ul class="note note-list">
                <li>Drop files <em>or whole folders</em> anywhere to add them to the current folder.</li>
                <li>Long-press (touch) or right-click (mouse) any item for its actions.</li>
                <li>Edits live in memory until you save — the header shows “Unsaved”.</li>
                <li>Legacy vaults open as-is and are upgraded to the current format on save.</li>
                <li>Nothing is uploaded, and no key material is ever written to storage.</li>
              </ul>
            </section>
          </div>
        </div>
      </div>
    </template>
    <!-- ==================== Viewer ==================== -->
    <div class="viewer" x-show="viewer.open" x-cloak>
      <div class="viewer-bar">
        <button class="btn btn-ghost btn-icon" @click="closeViewer()" aria-label="Back">
          <svg class="icon"><use href="#i-left"/></svg>
        </button>
        <h3 x-text="viewer.name"></h3>
        <span class="chip chip-warn" x-show="viewer.dirty" x-cloak>Edited</span>

        <div class="viewer-tools">
          <template x-if="viewer.kind === 'image'">
            <span style="display: flex; gap: 2px">
              <button class="btn btn-ghost btn-icon optional" @click="zoomBy(1 / 1.25)" aria-label="Zoom out">
                <svg class="icon"><use href="#i-zoom-out"/></svg>
              </button>
              <button class="btn btn-ghost btn-icon optional" @click="zoomBy(1.25)" aria-label="Zoom in">
                <svg class="icon"><use href="#i-zoom-in"/></svg>
              </button>
              <button class="btn btn-ghost btn-icon" @click="viewer.rotate = (viewer.rotate + 90) % 360" aria-label="Rotate">
                <svg class="icon"><use href="#i-rotate"/></svg>
              </button>
              <button class="btn btn-ghost btn-icon optional" @click="resetZoom()" aria-label="Reset view">
                <svg class="icon"><use href="#i-check"/></svg>
              </button>
            </span>
          </template>

          <button class="btn btn-ghost btn-icon" x-show="viewer.kind === 'markdown'"
                  @click="viewer.editing = !viewer.editing" :aria-label="viewer.editing ? 'Preview' : 'Edit'">
            <svg class="icon"><use :href="viewer.editing ? '#i-eye' : '#i-pencil'"/></svg>
          </button>
          <button class="btn btn-ghost btn-icon optional" x-show="viewer.editing"
                  @click="viewer.wrap = !viewer.wrap" aria-label="Toggle word wrap">
            <svg class="icon"><use href="#i-wrap"/></svg>
          </button>
          <button class="btn btn-primary" x-show="viewer.editing" @click="saveEdit()">
            <svg class="icon"><use href="#i-save"/></svg> Save
          </button>
          <button class="btn btn-ghost btn-icon" @click="exportOne({ path: viewer.path, name: viewer.name })"
                  aria-label="Export a copy">
            <svg class="icon"><use href="#i-download"/></svg>
          </button>
        </div>
      </div>

      <div class="stage" @pointerdown="onStageDown($event)" @pointermove="onStageMove($event)"
           @pointerup="onStageUp($event)" @pointercancel="onStageUp($event)"
           @wheel="onStageWheel($event)">
        <button class="btn btn-ghost btn-icon nav prev" x-show="viewableRows.length > 1 && !viewer.editing"
                @click="step(-1)" aria-label="Previous">
          <svg class="icon"><use href="#i-left"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon nav next" x-show="viewableRows.length > 1 && !viewer.editing"
                @click="step(1)" aria-label="Next">
          <svg class="icon"><use href="#i-right"/></svg>
        </button>

        <template x-if="viewer.kind === 'image' && viewer.url">
          <img class="subject" :src="viewer.url" :alt="viewer.name"
               :style="`transform: translate(${viewer.x}px, ${viewer.y}px) scale(${viewer.zoom}) rotate(${viewer.rotate}deg)`" />
        </template>
        <template x-if="viewer.kind === 'media' && viewer.url">
          <video :src="viewer.url" controls playsinline autoplay style="max-height: 100%"></video>
        </template>
        <template x-if="viewer.kind === 'audio' && viewer.url">
          <audio :src="viewer.url" controls autoplay style="width: min(520px, 90%)"></audio>
        </template>
        <template x-if="viewer.kind === 'pdf' && viewer.url">
          <iframe :src="viewer.url" title="PDF preview"></iframe>
        </template>
        <!-- Gated on `html` so the iframe is created with its srcdoc already
             set; a sandboxed frame does not reliably reload when srcdoc is
             assigned after insertion. -->
        <template x-if="viewer.kind === 'markdown' && !viewer.editing && viewer.html">
          <iframe :srcdoc="viewer.html" sandbox="" title="Markdown preview"></iframe>
        </template>
        <template x-if="viewer.editing">
          <div class="editor">
            <textarea x-model="viewer.text" @input="viewer.dirty = true" spellcheck="false"
                      :data-wrap="viewer.wrap ? 'on' : 'off'"
                      @keydown.tab.prevent="insertTab($event)"></textarea>
          </div>
        </template>
        <template x-if="viewer.kind === 'download'">
          <div class="empty">
            <svg class="icon"><use href="#i-file"/></svg>
            <p>No built-in preview for this format.</p>
            <button class="btn btn-primary" @click="exportOne({ path: viewer.path, name: viewer.name })">
              <svg class="icon"><use href="#i-download"/></svg> Export a copy
            </button>
          </div>
        </template>
      </div>
    </div>

  </body>
</html>
